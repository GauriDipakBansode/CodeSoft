<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe AI</title>

    <!-- Link CSS from static folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Tic Tac Toe (You vs AI)</h1>

<!-- Game Board -->
<div id="board">
    <!-- 9 buttons = 9 cells -->
    <button onclick="playMove(0)"></button>
    <button onclick="playMove(1)"></button>
    <button onclick="playMove(2)"></button>

    <button onclick="playMove(3)"></button>
    <button onclick="playMove(4)"></button>
    <button onclick="playMove(5)"></button>

    <button onclick="playMove(6)"></button>
    <button onclick="playMove(7)"></button>
    <button onclick="playMove(8)"></button>
</div>

<!-- Result text -->
<p id="status"></p>

<!-- Reset button -->
<button onclick="resetGame()">Reset Game</button>

<!-- Link JS -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
